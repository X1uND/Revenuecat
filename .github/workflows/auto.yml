name: Revenuecat Auto Sync

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Files
        shell: bash
        run: |
          set -e

          echo "=== Download Reheji.js ==="

          if curl -fL \
            https://raw.githubusercontent.com/chxm1023/Rewrite/main/Reheji.js \
            -o /tmp/Reheji.js; then

            cp /tmp/Reheji.js Revenuecat.js
            echo "Reheji.js downloaded successfully."

          else

            echo "Upstream Reheji.js does not exist."

            if [ -f "Revenuecat.js" ]; then
              echo "Deleting local Revenuecat.js"
              rm -f Revenuecat.js
            else
              echo "Local Revenuecat.js also does not exist."
            fi

          fi

          echo "=== Download iTunes.js ==="

          if curl -fL \
            https://raw.githubusercontent.com/chxm1023/Rewrite/main/iTunes.js \
            -o /tmp/iTunes.js; then

            cp /tmp/iTunes.js iTunes.js
            echo "iTunes.js downloaded successfully."

          else

            echo "Upstream iTunes.js does not exist."

            if [ -f "iTunes.js" ]; then
              echo "Deleting local iTunes.js"
              rm -f iTunes.js
            else
              echo "Local iTunes.js also does not exist."
            fi

          fi

      - name: Commit & Push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Revenuecat.js
          git add iTunes.js

          if git diff --cached --quiet; then
            echo "No JS file changes."
          else
            git commit -m "auto: sync js files"
            git push
          fi

          # ==========================================================
          # 40 天维护仓库活动
          #
          # heartbeat 文件：
          # .github/sync-heartbeat
          #
          # 如果距离上一次 heartbeat >= 40 天，
          # 创建一次维护 commit。
          # ==========================================================

          echo "=== Check 40-day repository activity ==="

          HEARTBEAT_FILE=".github/sync-heartbeat"

          mkdir -p .github

          if [ -f "$HEARTBEAT_FILE" ]; then
            LAST_HEARTBEAT=$(cat "$HEARTBEAT_FILE")

            LAST_HEARTBEAT_TS=$(
              date -d "$LAST_HEARTBEAT" +%s 2>/dev/null || echo 0
            )
          else
            LAST_HEARTBEAT_TS=0
          fi

          NOW_TS=$(date +%s)

          if [ "$LAST_HEARTBEAT_TS" -eq 0 ]; then
            DAYS=999
          else
            DAYS=$(( (NOW_TS - LAST_HEARTBEAT_TS) / 86400 ))
          fi

          echo "Days since last heartbeat: ${DAYS}"

          if [ "$DAYS" -ge 40 ]; then
            NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            echo "Creating heartbeat: ${NOW_UTC}"

            printf '%s\n' "$NOW_UTC" > "$HEARTBEAT_FILE"

            git add "$HEARTBEAT_FILE"

            git commit \
              -m "chore: keep repository active"

            git push origin HEAD

            echo "=== Heartbeat commit completed ==="
          else
            echo "No heartbeat required."
          fi

          echo "=== Sync completed ==="
